<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Energy Portrait Analysis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#8B5CF6", // A vibrant purple
              secondary: "#A78BFA", // Lighter purple
              "background-light": "#F3F0FF", // Very light lavender
              "background-dark": "#1F1D2B", // Dark purple/black for dark mode
              "card-light": "rgba(255, 255, 255, 0.65)",
              "card-dark": "rgba(30, 27, 46, 0.7)",
              // Five Elements Colors
              "element-wood": "#10B981", // Green
              "element-fire": "#EF4444", // Red
              "element-earth": "#F59E0B", // Yellow
              "element-metal": "#E5E7EB", // White/Silver (mapped to gray-200 for visibility)
              "element-water": "#3B82F6", // Blue/Black
            },
            fontFamily: {
              display: ['"Noto Sans SC"', 'sans-serif'],
              sans: ['"Noto Sans SC"', 'sans-serif'],
            },
            borderRadius: {
              DEFAULT: "1rem",
              "xl": "1.5rem",
              "2xl": "2rem",
              "3xl": "2.5rem",
            },
            boxShadow: {
              'soft': '0 10px 40px -10px rgba(139, 92, 246, 0.15)',
              'glow': '0 0 20px rgba(139, 92, 246, 0.3)',
              'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3)',
            },
            animation: {
                'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'float': 'float 6s ease-in-out infinite',
                'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                }
            }
          },
        },
      };
    </script>
<style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .dark .glass-panel {
            background: rgba(30, 30, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }.radar-grid {
            background-image: 
                radial-gradient(circle at center, transparent 0%, transparent 19%, rgba(139, 92, 246, 0.1) 20%, transparent 21%),
                radial-gradient(circle at center, transparent 0%, transparent 39%, rgba(139, 92, 246, 0.1) 40%, transparent 41%),
                radial-gradient(circle at center, transparent 0%, transparent 59%, rgba(139, 92, 246, 0.1) 60%, transparent 61%);
        }
        .element-blob {
            filter: blur(20px);
            opacity: 0.7;
            mix-blend-mode: multiply;
        }
        .dark .element-blob {
            mix-blend-mode: screen;
            opacity: 0.5;
        }.missing-element-ring {
            stroke-dasharray: 4 4;
            opacity: 0.4;
        }
        .cyber-glow-text {
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-100 min-h-screen relative overflow-hidden flex justify-center">
<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[50%] rounded-full bg-purple-200 dark:bg-purple-900 blur-[120px] opacity-30"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[70%] h-[60%] rounded-full bg-blue-200 dark:bg-indigo-900 blur-[120px] opacity-30"></div>
</div>
<div class="w-full max-w-md h-screen flex flex-col relative bg-white/10 dark:bg-black/20 backdrop-blur-[2px]">
<div class="h-12 w-full flex items-center justify-between px-6 pt-2 z-20">
<span class="text-sm font-semibold">15:36</span>
<div class="flex items-center space-x-1">
<span class="material-symbols-outlined text-base">signal_cellular_alt</span>
<span class="material-symbols-outlined text-base">wifi</span>
<span class="material-symbols-outlined text-base rotate-90">battery_full</span>
</div>
</div>
<div class="flex-1 overflow-y-auto px-5 pt-2 pb-28 scrollbar-hide">
<div class="flex justify-between items-center mb-6">
<div>
<h1 class="text-2xl font-bold text-gray-800 dark:text-white tracking-wide">五行能量画像</h1>
<p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Energy Portrait Analysis</p>
</div>
<button class="p-2 rounded-full hover:bg-white/50 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">history</span>
</button>
</div>
<div class="glass-panel rounded-2xl p-4 mb-6 shadow-sm flex items-center justify-between">
<div class="flex flex-col">
<span class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">您的生辰八字</span>
<div class="flex items-center space-x-2">
<span class="text-sm font-medium text-gray-700 dark:text-gray-200">1995年 08月 15日</span>
<span class="px-2 py-0.5 bg-purple-100 dark:bg-purple-900/50 text-purple-600 dark:text-purple-300 text-xs rounded-full">未时</span>
</div>
</div>
<button class="text-primary hover:text-purple-700 transition-colors">
<span class="material-symbols-outlined">edit_calendar</span>
</button>
</div>
<div class="relative w-full aspect-square mb-6 flex items-center justify-center">
<div class="absolute inset-0 radar-grid rounded-full border border-purple-100 dark:border-white/5 opacity-50"></div>
<div class="absolute w-full h-full animate-spin-slow opacity-80">
<div class="absolute top-[10%] left-1/2 -translate-x-1/2 w-32 h-32 bg-element-fire rounded-full element-blob animate-pulse-slow"></div>
<div class="absolute top-[30%] left-[15%] w-24 h-24 bg-element-wood rounded-full element-blob"></div>
</div>
<div class="relative w-[70%] h-[70%] z-10">
<svg class="w-full h-full transform -rotate-90 drop-shadow-lg" viewBox="0 0 100 100">
<circle class="text-gray-200 dark:text-gray-700" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="0.5"></circle>
<path class="opacity-90" d="M 50 50 L 85 30 A 40 40 0 0 1 90 50 Z" fill="url(#grad-fire)"></path>
<path class="opacity-60" d="M 50 50 L 90 50 A 40 40 0 0 1 75 80 Z" fill="url(#grad-earth)"></path>
<path d="M 50 50 L 75 80 A 40 40 0 0 1 25 80" fill="none" stroke="#9CA3AF" stroke-dasharray="2 2" stroke-width="1"></path>
<path d="M 50 50 L 25 80 A 40 40 0 0 1 10 50" fill="none" stroke="#3B82F6" stroke-dasharray="2 2" stroke-width="1"></path>
<path class="opacity-80" d="M 50 50 L 10 50 A 40 40 0 0 1 85 30 Z" fill="url(#grad-wood)"></path>
<defs>
<linearGradient id="grad-fire" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#FCA5A5;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#EF4444;stop-opacity:1"></stop>
</linearGradient>
<linearGradient id="grad-wood" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#6EE7B7;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#10B981;stop-opacity:1"></stop>
</linearGradient>
<linearGradient id="grad-earth" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1"></stop>
</linearGradient>
</defs>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-16 h-16 bg-white dark:bg-[#252236] rounded-full shadow-lg flex items-center justify-center border border-purple-50 dark:border-gray-700 z-20">
<span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-br from-purple-500 to-indigo-600">强火</span>
</div>
</div>
<span class="absolute top-0 left-1/2 -translate-x-1/2 -mt-6 text-xs font-medium text-gray-500">火 (Fire)</span>
<span class="absolute bottom-[15%] right-[-10%] text-xs font-medium text-gray-400">土</span>
<span class="absolute bottom-[-5%] left-1/2 -translate-x-1/2 text-xs font-medium text-gray-400 line-through decoration-gray-400">金</span>
<span class="absolute bottom-[15%] left-[-10%] text-xs font-medium text-blue-400">水</span>
<span class="absolute top-[15%] left-[-10%] text-xs font-medium text-emerald-600 font-bold">木</span>
</div>
</div>
<div class="glass-panel rounded-3xl p-6 shadow-soft border-t border-white/80 relative overflow-hidden mb-6">
<div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-bl from-blue-100 to-transparent dark:from-blue-900/20 rounded-bl-full pointer-events-none"></div>
<h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3 flex items-center">
<span class="material-symbols-outlined mr-2 text-primary">auto_awesome</span>
                    能量诊断
                 </h3>
<p class="text-gray-600 dark:text-gray-300 leading-relaxed text-sm mb-4">
                    你是<span class="font-bold text-amber-600 dark:text-amber-400">燥土</span>，极度缺水。如同干裂的大地急需雨露滋润。你的决策往往过于急躁，缺乏灵活性。
                 </p>
<div class="flex items-center space-x-3 bg-white/50 dark:bg-black/20 p-3 rounded-xl border border-white/40 dark:border-white/5">
<div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-blue-500 text-lg">water_drop</span>
</div>
<div>
<div class="text-xs text-gray-400 uppercase font-semibold">急需补充</div>
<div class="text-sm font-bold text-blue-600 dark:text-blue-300">Moisture (水元素)</div>
</div>
</div>
</div>
<button class="w-full bg-gradient-to-r from-primary to-secondary hover:from-purple-600 hover:to-purple-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/30 transform transition-all active:scale-[0.98] flex items-center justify-center group mb-8">
<span class="mr-2">开始决策</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="grid grid-cols-4 gap-3 mb-6">
<button class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/40 hover:bg-white/60 dark:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-purple-500 mb-1 text-xl">work</span>
<span class="text-[10px] text-gray-600 dark:text-gray-400">事业</span>
</button>
<button class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/40 hover:bg-white/60 dark:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-pink-500 mb-1 text-xl">favorite</span>
<span class="text-[10px] text-gray-600 dark:text-gray-400">感情</span>
</button>
<button class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/40 hover:bg-white/60 dark:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-amber-500 mb-1 text-xl">monetization_on</span>
<span class="text-[10px] text-gray-600 dark:text-gray-400">财运</span>
</button>
<button class="flex flex-col items-center justify-center p-2 rounded-xl bg-white/40 hover:bg-white/60 dark:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-teal-500 mb-1 text-xl">home</span>
<span class="text-[10px] text-gray-600 dark:text-gray-400">安居</span>
</button>
</div>
</div>
<div class="absolute bottom-0 w-full bg-white/80 dark:bg-[#151420]/95 backdrop-blur-xl border-t border-gray-200/50 dark:border-white/5 pb-6 pt-3 px-2 rounded-t-3xl z-30">
<div class="flex justify-around items-end">
<button class="flex flex-col items-center group w-1/5">
<span class="material-symbols-outlined text-2xl text-gray-400 group-hover:text-primary transition-colors mb-1 font-light">school</span>
<span class="text-[10px] text-gray-400 group-hover:text-primary transition-colors">学习</span>
</button>
<button class="flex flex-col items-center group w-1/5">
<span class="material-symbols-outlined text-2xl text-gray-400 group-hover:text-primary transition-colors mb-1 font-light">psychology</span>
<span class="text-[10px] text-gray-400 group-hover:text-primary transition-colors">思考</span>
</button>
<button class="flex flex-col items-center group w-1/5 relative -top-3">
<div class="relative w-12 h-12 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-purple-500/40">
<span class="material-symbols-outlined text-2xl text-white">auto_awesome</span>
</div>
<span class="text-[10px] text-primary font-medium mt-1">决策</span>
</button>
<button class="flex flex-col items-center group w-1/5">
<span class="material-symbols-outlined text-2xl text-gray-400 group-hover:text-primary transition-colors mb-1 font-light">trending_up</span>
<span class="text-[10px] text-gray-400 group-hover:text-primary transition-colors">成长</span>
</button>
<button class="flex flex-col items-center group w-1/5">
<span class="material-symbols-outlined text-2xl text-gray-400 group-hover:text-primary transition-colors mb-1 font-light">person</span>
<span class="text-[10px] text-gray-400 group-hover:text-primary transition-colors">我的</span>
</button>
</div>
<div class="w-1/3 h-1 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mt-4"></div>
</div>
</div>

</body></html>
