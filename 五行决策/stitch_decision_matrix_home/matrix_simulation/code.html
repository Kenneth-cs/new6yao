<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Life Coach - Matrix Simulation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#8B5CF6", 
              secondary: "#A78BFA",
              "background-light": "#F5F3FF", 
              "background-dark": "#0B0A14", // Deep space black
              "surface-light": "#FFFFFF",
              "surface-dark": "#181625",
              "space-black": "#050508",
              "alert-red": "#991B1B",
              "alert-border": "#EF4444",
              "energy-green": "#10B981",
              "energy-cyan": "#06b6d4",
            },
            fontFamily: {
              display: ["'Noto Sans SC'", "sans-serif"],
              sans: ["'Noto Sans SC'", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              "xl": "1.5rem",
              "2xl": "2rem",
            },
            animation: {
                'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'float': 'float 6s ease-in-out infinite',
                'spin-slow': 'spin 20s linear infinite',
                'spin-reverse': 'spin 25s linear infinite reverse',
                'fly-in': 'flyIn 2s ease-out infinite',
            },
            keyframes: {
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-10px)' },
                },
                flyIn: {
                    '0%': { transform: 'scale(0) translate(0, 0)', opacity: 0 },
                    '10%': { opacity: 1 },
                    '100%': { transform: 'scale(1) translate(var(--tx), var(--ty))', opacity: 0 },
                }
            }
          },
        },
      };
    </script>
<style type="text/tailwindcss">
:root {
  --neon-green: #10B981;
  --neon-red: #EF4444;
  --neon-blue: #3B82F6;
}.space-bg {
    background: radial-gradient(circle at center, #1e1b4b 0%, #0B0A14 60%, #000000 100%);
}
.vortex-container {
    perspective: 1000px;
}
.vortex-ring {
    background: conic-gradient(from 0deg, transparent 0%, rgba(139, 92, 246, 0.1) 20%, rgba(59, 130, 246, 0.3) 50%, rgba(139, 92, 246, 0.1) 80%, transparent 100%);
    border-radius: 50%;
    filter: blur(8px);
}
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    filter: drop-shadow(0 0 4px var(--color));
}
.energy-label-green {
    text-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
}
.energy-label-red {
    text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
}
.alert-glow {
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.3), inset 0 0 20px rgba(239, 68, 68, 0.2);
}
.star-field {
    background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
    background-size: 550px 550px, 350px 350px, 250px 250px;
    background-position: 0 0, 40px 60px, 130px 270px;
}
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-dark font-sans text-gray-100 min-h-screen antialiased selection:bg-primary selection:text-white transition-colors duration-300 overflow-hidden">

<div class="absolute w-1 h-1 bg-green-400 rounded-full top-1/2 right-4 shadow-[0_0_8px_#10B981]"></div>

<path d="M100,100 m0,-60 a60,60 0 1,0 0,120 a60,60 0 1,0 0,-120" fill="none" stroke="url(#grad2)" stroke-dasharray="5 15" stroke-width="0.8"></path>
<defs>

<stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"></stop>

<stop offset="50%" style="stop-color:#10b981;stop-opacity:1"></stop>

<div class="absolute bottom-32 w-[85%] max-w-sm bg-alert-red/20 backdrop-blur-md border border-alert-border rounded-2xl p-5 flex flex-col items-center text-center shadow-2xl alert-glow z-30">

        </p>
<button class="bg-white text-black text-sm font-semibold py-2 px-8 rounded-full hover:bg-gray-100 transition-colors shadow-lg">

</main>

<button class="flex flex-col items-center gap-1 w-16 text-gray-500 hover:text-gray-300">

<button class="flex flex-col items-center gap-1 w-16 text-gray-500 hover:text-gray-300">

</div>
<div class="w-full flex justify-center mt-4">
<div class="w-32 h-1 bg-gray-600 rounded-full"></div>
</div>
