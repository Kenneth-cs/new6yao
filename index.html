<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻 - 政策与协议</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            margin: 20px;
            background-color: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #1d1d1f;
            font-size: 48px;
            margin: 0;
            font-weight: 700;
        }
        .logo p {
            color: #86868b;
            font-size: 16px;
            margin: 10px 0 0 0;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }
        .link-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 25px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .link-card.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        .link-card.secondary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }
        .link-content {
            flex: 1;
        }
        .link-title {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 5px 0;
        }
        .link-desc {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }
        .link-icon {
            font-size: 30px;
            opacity: 0.8;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e5e5e7;
        }
        .footer p {
            color: #86868b;
            font-size: 14px;
            margin: 5px 0;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>六爻</h1>
            <p>易经智慧 · 决策助手</p>
        </div>

        <div class="links">
            <a href="privacy.html" class="link-card">
                <div class="link-content">
                    <h2 class="link-title">隐私政策</h2>
                    <p class="link-desc">了解我们如何保护您的隐私</p>
                </div>
                <div class="link-icon">🔒</div>
            </a>

            <a href="terms.html" class="link-card secondary">
                <div class="link-content">
                    <h2 class="link-title">用户协议</h2>
                    <p class="link-desc">查看服务条款和订阅说明</p>
                </div>
                <div class="link-icon">📋</div>
            </a>
        </div>

        <div class="footer">
            <p><strong>联系我们</strong></p>
            <p>邮箱: <a href="mailto:zhangshaocong6@gmail.com">zhangshaocong6@gmail.com</a></p>
            <p style="margin-top: 20px; color: #d2d2d7;">© 2025 六爻. 保留所有权利。</p>
        </div>
    </div>
</body>
</html>
